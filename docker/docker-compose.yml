version: '3.8'

services:
  fashion-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fashion-recommendation-system
    ports:
      - "5000:5000"
    volumes:
      - ../backend:/app
      - model-cache:/root/.cache/huggingface
    environment:
      - DEVICE=cpu
      - MAX_RAM_GB=8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model-cache:
    driver: local
