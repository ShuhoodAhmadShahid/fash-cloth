version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fashion-ai-backend
    expose:
      - "8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL=${HF_MODEL:-stabilityai/stable-diffusion-2-1}
      - TRANSFORMERS_CACHE=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: fashion-ai-frontend
    ports:
      - "80:80"
    volumes:
      - ../backend/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local
